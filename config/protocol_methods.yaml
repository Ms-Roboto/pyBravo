  - method_id: reference:agilent-384st10-dmso
    version: 1.0.0
    status: reference_candidate
    title: Agilent 384ST10 0.25% tartrazine in DMSO performance example
    applicability:
      head_types: [HT_384_D_70, HT_384_D_70_S2]
      tip_ids: [st_10ul]
      reagent_families: [DMSO]
      operations: [transfer, distribute]
      min_volume_ul: 0.3
      max_volume_ul: 10.0
    evidence:
      - source_type: publication
        source_url: https://www.agilent.com/cs/library/technicaloverviews/public/te-bravo-automated-liquid-handling-384st-10-ul-tip-5990-3645en-agilent.pdf
        retrieved_at: '2026-10-06'
        note: Vendor used 0.25% (w/v) tartrazine dissolved in DMSO, not neat DMSO. Transfer performance was reported for 0.3, 0.5, and 2.0 uL from a manual-fill reservoir into a dry 384-well polystyrene plate. The 5 uL point was used in an absorbance calibration curve, not reported as a separate transfer-performance result. At 2 uL, the task used 6 mm aspiration height and 1 uL preaspirate, then 0 mm dispense height and 1 uL blowout for that reservoir-to-polystyrene geometry. The broad DMSO reagent-family tag supports related-reference discovery only; it is not an exact formulation match, does not provide liquid-class motion settings, and does not qualify neat DMSO or Labcyte PP-to-LDV transfer on this machine.

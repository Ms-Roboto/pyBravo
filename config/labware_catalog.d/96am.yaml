# Labware the AssayMAP 96AM support needs, shipped with the feature.
#
# These are merged on top of whatever the catalog resolves to -- Mongo or the
# local snapshot -- by build_labware_catalog(). They are NOT in the snapshot on
# purpose: with Mongo configured the snapshot is overwritten on every successful
# load, and committing a full snapshot would replace a site's own catalog.
#
# Agilent's standard definitions, converted from the vendor labware files. Every
# dimension here is a property of the labware, not of any one instrument.
#
# height_mm is the vendor THICKNESS, and it is an input to head motion rather
# than description: the AssayMAP references every Z to the top of the labware, so
# the seated press depth and the stripper-plate shuck height are both computed
# from it. Do not adjust it to make a plate "look right" in a viewer.
# dead_volume_ul values on liquid-bearing rows are unreviewed review placeholders;
# see docs/labware_dead_volume_review.md before using them for a protocol.
